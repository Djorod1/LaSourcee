name: Tests

# Rien ne vérifiait le code automatiquement : les suites ne tournaient
# que lancées à la main. Ce workflow les exécute sur chaque pull request
# et sur chaque poussée vers main, sur les deux moteurs de base réellement
# utilisés — SQLite en développement, PostgreSQL en production.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Suites d'intégration et de déploiement
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lasource_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer les dépendances
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Contrôler la syntaxe du frontend
        run: node --check script.js && node --check api.js

      - name: Contrôler la syntaxe de la configuration
        run: |
          python -c "import json; json.load(open('vercel.json'))"
          bash -n demarrer.sh

      # Le plan du site n'est plus un fichier : il est construit à
      # partir des questions réellement publiées. On contrôle donc ce
      # que le serveur produit, ce qui vaut mieux que de relire un
      # fichier que plus personne ne sert.
      - name: Contrôler le plan du site produit par le serveur
        working-directory: backend
        env:
          DB_TYPE: sqlite
          DB_PATH: /tmp/plan_du_site.db
          SECRET_KEY: cle-de-controle-du-plan-du-site-suffisamment-longue
          EMAIL_MODE: console
          URL_PLATEFORME: https://lasourcee.org
        run: |
          python - <<'CONTROLE'
          import sys, xml.dom.minidom
          sys.path.insert(0, '.')
          from app import creer_application

          reponse = creer_application().test_client().get('/sitemap.xml')
          assert reponse.status_code == 200, reponse.status_code
          xml.dom.minidom.parseString(reponse.get_data())
          print('Plan du site valide :', len(reponse.get_data()), 'octets')
          CONTROLE

      - name: Contrôler la rédaction des textes visibles
        working-directory: backend
        run: python tests_redaction.py

      - name: Contrôler le contraste du mode sombre
        working-directory: backend
        run: python tests_contraste.py

      - name: Tests d'intégration — SQLite
        working-directory: backend
        run: python tests_integration.py

      - name: Tests d'intégration — PostgreSQL
        working-directory: backend
        env:
          DB_TYPE: postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lasource_test
        run: python tests_integration.py

      # La suite de déploiement vide elle-même le schéma avant de
      # contrôler : seule la base doit exister.
      - name: Créer la base de la vérification de déploiement
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c 'CREATE DATABASE lasource_deploi;'

      - name: Vérification de déploiement — conditions Vercel
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lasource_deploi
        run: python tests_deploiement.py
